services:
  replique:
    build: .
    image: replique:local
    restart: unless-stopped
    read_only: true
    user: "10001:10001"
    environment:
      REPLIQUE_MODE: owner_chatgpt
      REPLIQUE_PUBLIC_ORIGIN: https://replique.duckdns.org
      REPLIQUE_OAUTH_ENABLED: "1"
      REPLIQUE_CREDENTIAL_KEY_FILE: /run/secrets/credential.key
      REPLIQUE_MODEL: ${REPLIQUE_MODEL:-}
      REPLIQUE_DATA_DIR: /data
    ports:
      - "127.0.0.1:18081:8000"
    volumes:
      - ./data:/data
      - ./secrets/credential.key:/run/secrets/credential.key:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
