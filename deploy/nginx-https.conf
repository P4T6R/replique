server {
    listen 80;
    listen [::]:80;
    server_name replique.duckdns.org;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/replique-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name replique.duckdns.org;
    access_log off;
    root /opt/replique/deploy;
    index index.html;
    charset utf-8;

    ssl_certificate /etc/letsencrypt/live/replique.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replique.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location = / {
        try_files /index.html =404;
    }

    location / {
        return 404;
    }
}
