limit_req_zone $binary_remote_addr zone=replique_login:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=replique_generate:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=replique_ocr:1m rate=12r/m;
limit_req_zone $binary_remote_addr zone=replique_memory:1m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name replique.duckdns.org;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/replique-acme;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name replique.duckdns.org;
    access_log off;

    ssl_certificate /etc/letsencrypt/live/replique.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/replique.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    limit_req_status 429;
    error_page 429 = @replique_rate_limited;

    location @replique_rate_limited {
        default_type application/json;
        return 429 '{"detail":"Trop de demandes. Réessayez dans un instant."}';
    }

    location = /api/account/login {
        limit_req zone=replique_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }

    location = /api/generate {
        limit_req zone=replique_generate burst=3 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }

    location = /api/ocr {
        limit_req zone=replique_ocr burst=2 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
        client_max_body_size 11m;
    }

    location ^~ /api/memory {
        limit_req zone=replique_memory burst=10 nodelay;
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
    }

    location / {
        proxy_pass http://127.0.0.1:18081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 150s;
        client_max_body_size 11m;
    }
}
